name: Python CI/CD Pipeline

on:
  push:
    branches: ["main", "staging", "develop"]
  pull_request:
    branches: ["main", "staging"]

env:
  IMAGE_NAME: student-python-api

jobs:
  test-build-scan-deploy:
    name: Test, Build, Scan & Request Deployment
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests
      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build Docker image for security scanning
      - name: Build Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 8: Run Trivy vulnerability scanner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "json"
          output: "trivy-report.json"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"

      # Step 9: Push Docker image to Docker Hub
      - name: Push Docker Image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # Step 10: Send deployment request to College Cloud CI/CD Manager
      - name: Send Deployment Request to College Cloud CI/CD Manager
        if: github.event_name == 'push'
        env:
          COLLEGE_CD_URL: ${{ secrets.COLLEGE_CD_URL }}
          COLLEGE_CD_TOKEN: ${{ secrets.COLLEGE_CD_TOKEN }}
          COLLEGE_PROJECT_ID: ${{ vars.COLLEGE_PROJECT_ID }}
        run: |
          set -euo pipefail

          echo "Validating CI/CD Manager configuration..."

          if [ -z "$COLLEGE_CD_URL" ]; then
            echo "ERROR: COLLEGE_CD_URL is not configured."
            exit 1
          fi

          if [ -z "$COLLEGE_CD_TOKEN" ]; then
            echo "ERROR: COLLEGE_CD_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$COLLEGE_PROJECT_ID" ]; then
            echo "ERROR: COLLEGE_PROJECT_ID is not configured."
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="PRODUCTION"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            TARGET_ENV="STAGING"
          else
            echo "ERROR: Unsupported deployment branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "Deployment configuration:"
          echo "  Project ID: $COLLEGE_PROJECT_ID"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Environment: $TARGET_ENV"
          echo "  Commit: ${{ github.sha }}"

          # Extract vulnerability counts from machine-readable Trivy JSON report
          echo "Extracting Trivy vulnerability scan results..."
          if [ ! -f trivy-report.json ]; then
            echo "ERROR: trivy-report.json not found! Security scan is missing or failed."
            exit 1
          fi

          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "CRITICAL")] | length' trivy-report.json)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "HIGH")] | length' trivy-report.json)
          MEDIUM_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "MEDIUM")] | length' trivy-report.json)
          LOW_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "LOW")] | length' trivy-report.json)

          if [ -z "$CRITICAL_COUNT" ] || [ -z "$HIGH_COUNT" ] || [ -z "$MEDIUM_COUNT" ] || [ -z "$LOW_COUNT" ]; then
            echo "ERROR: Failed to extract vulnerability counts from trivy-report.json."
            exit 1
          fi

          # Derive Trivy status based on scan results (Critical vulnerabilities block deployment)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            TRIVY_STATUS="FAILED"
          else
            TRIVY_STATUS="PASSED"
          fi

          echo "Trivy Scan Results:"
          echo "  Critical: $CRITICAL_COUNT"
          echo "  High:     $HIGH_COUNT"
          echo "  Medium:   $MEDIUM_COUNT"
          echo "  Low:      $LOW_COUNT"
          echo "  Status:   $TRIVY_STATUS"

          # Build JSON safely with jq.
          # This prevents commit messages or other values from breaking JSON.
          REQUEST_BODY=$(jq -n \
            --arg projectId "$COLLEGE_PROJECT_ID" \
            --arg commitSha "${{ github.sha }}" \
            --arg commitMessage "${{ github.event.head_commit.message || 'Auto deployment via GitHub Actions' }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg environment "$TARGET_ENV" \
            --arg image "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" \
            --arg imageTag "${{ github.sha }}" \
            --arg trivyStatus "$TRIVY_STATUS" \
            --argjson critical "$CRITICAL_COUNT" \
            --argjson high "$HIGH_COUNT" \
            --argjson medium "$MEDIUM_COUNT" \
            --argjson low "$LOW_COUNT" \
            '{
              projectId: ($projectId | tonumber),
              commitSha: $commitSha,
              commitMessage: $commitMessage,
              branch: $branch,
              environment: $environment,
              image: $image,
              imageTag: $imageTag,
              trivyStatus: $trivyStatus,
              trivySummary: {
                critical: $critical,
                high: $high,
                medium: $medium,
                low: $low
              }
            }')

          echo "Sending deployment request to College Cloud CI/CD Manager..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            "$COLLEGE_CD_URL/api/deployments/request" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $COLLEGE_CD_TOKEN" \
            --data "$REQUEST_BODY")

          echo "FastAPI HTTP status: $HTTP_STATUS"

          echo "FastAPI response:"
          cat response.json

          # Only 2xx responses count as successful deployment requests.
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo ""
            echo "ERROR: College Cloud CI/CD Manager rejected the deployment request."
            echo "HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo ""
          echo "Deployment request accepted by College Cloud CI/CD Manager."
