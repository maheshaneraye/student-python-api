name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main", "staging" ]

env:
  IMAGE_NAME: student-python-api

jobs:
  test-build-scan-deploy:
    name: Test, Build, Scan & Request Deployment
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Source Code
        uses: actions/checkout@v4

      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Registry
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build Docker image for security scanning
      - name: Build Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 8: Run Trivy Vulnerability Scanner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # Step 9: Push Docker Image to Registry
      - name: Push Docker Image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # Step 10: Trigger Centralized CI/CD Manager API (The Webhook Bridge)
      - name: Send Deployment Request to College Cloud CI/CD Manager
        if: github.event_name == 'push'
        run: |
          echo "Connecting to College Cloud Control Plane at ${{ secrets.COLLEGE_CD_URL }}..."
          
          COLLEGE_URL="${{ secrets.COLLEGE_CD_URL }}"
          if [ -z "$COLLEGE_URL" ]; then
            COLLEGE_URL="http://localhost:8000"
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="PRODUCTION"
          else
            TARGET_ENV="STAGING"
          fi

          curl -X POST "$COLLEGE_URL/api/deployments/request" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COLLEGE_CD_TOKEN || 'demo_jwt_token_student_2026' }}" \
            -d '{
              "projectId": ${{ vars.COLLEGE_PROJECT_ID || 4 }},
              "commitSha": "${{ github.sha }}",
              "commitMessage": "${{ github.event.head_commit.message || 'Auto deployment via GitHub Actions' }}",
              "branch": "${{ github.ref_name }}",
              "environment": "'"$TARGET_ENV"'",
              "image": "${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}",
              "imageTag": "${{ github.sha }}",
              "trivyStatus": "PASSED"
            }'
